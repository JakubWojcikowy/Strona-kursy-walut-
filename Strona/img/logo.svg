<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!-- Logo Icon -->
  <rect x="4" y="8" width="48" height="48" rx="12" fill="url(#logo-grad)"/>
  <path d="M20 38L26 28L32 34L40 22" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="40" cy="22" r="3" fill="#38bdf8"/>
  <circle cx="20" cy="38" r="2" fill="#ffffff"/>
  <!-- Currency symbols motif -->
  <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" opacity="0.8">zł</text>
  <text x="34" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#93c5fd" opacity="0.9">€</text>
  
  <!-- Logo Text -->
  <text x="64" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="currentColor" letter-spacing="-0.5">Waluta<tspan fill="#2563eb">Stat</tspan></text>
