<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <!-- Background Glow & Grid -->
  <rect width="500" height="350" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="460" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Decorative chart background -->
  <path d="M40 260 C 100 230, 160 270, 220 200 C 280 130, 360 170, 460 90" stroke="#3b82f6" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M40 260 C 100 230, 160 270, 220 200 C 280 130, 360 170, 460 90 L 460 290 L 40 290 Z" fill="url(#hero-area-grad)" opacity="0.15"/>
  
  <!-- Floating Currency Badges -->
  <!-- EUR Badge -->
  <g transform="translate(60, 60)">
    <rect width="110" height="64" rx="12" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))" stroke="#e2e8f0"/>
    <circle cx="28" cy="32" r="16" fill="#eff6ff"/>
    <text x="28" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">€</text>
    <text x="52" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">EUR/PLN</text>
    <text x="52" y="45" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">4.3150</text>
  </g>

  <!-- USD Badge -->
  <g transform="translate(190, 40)">
    <rect width="110" height="64" rx="12" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))" stroke="#e2e8f0"/>
    <circle cx="28" cy="32" r="16" fill="#ecfdf5"/>
    <text x="28" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">$</text>
    <text x="52" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">USD/PLN</text>
    <text x="52" y="45" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">3.9820</text>
  </g>

  <!-- GBP Badge -->
  <g transform="translate(320, 70)">
    <rect width="110" height="64" rx="12" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))" stroke="#e2e8f0"/>
    <circle cx="28" cy="32" r="16" fill="#fdf2f8"/>
    <text x="28" y="37" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#db2777" text-anchor="middle">£</text>
    <text x="52" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">GBP/PLN</text>
    <text x="52" y="45" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">5.1590</text>
  </g>

  <!-- Central Exchange Indicator Card -->
  <g transform="translate(130, 160)">
    <rect width="240" height="110" rx="14" fill="#1e293b" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.15))"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Średni kurs NBP &amp; Spread</text>
    
    <text x="20" y="65" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff">PLN ⇄ Waluty</text>
    <rect x="20" y="78" width="70" height="20" rx="4" fill="#059669" fill-opacity="0.2"/>
    <text x="55" y="92" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">+0.33% DZIŚ</text>

    <!-- Swap arrows symbol -->
    <circle cx="205" cy="55" r="22" fill="#2563eb"/>
    <path d="M198 52h14m-3-3l3 3-3 3M212 58h-14m3-3l-3 3 3 3" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <defs>
    <linearGradient id="hero-area-grad" x1="250" y1="90" x2="250" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
